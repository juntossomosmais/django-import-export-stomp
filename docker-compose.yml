version: "3.9"

# https://docs.docker.com/compose/compose-file/compose-file-v3/#extension-fields
x-build: &dockerfile-dev-build
  context: .
  dockerfile: Dockerfile

services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - example

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - 15672:15672
    volumes:
      - ./tests/resources/custom-rabbitmq-conf:/etc/rabbitmq/
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - example

  pubsub:
    build: *dockerfile-dev-build
    volumes:
      - .:/app
    env_file: .env
    environment:
      - AWS_S3_ENDPOINT_URL=http://s3mock:9090
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      s3mock:
        condition: service_healthy
    command: ["python", "example/manage.py", "import_export_pubsub"]
    networks:
      - example

  example:
    build: *dockerfile-dev-build
    volumes:
      - .:/app
    env_file: .env
    ports:
      - "${DJANGO_BIND_PORT:-8080}:${DJANGO_BIND_PORT:-8080}"
    depends_on:
      pubsub:
        condition: service_started
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      s3mock:
        condition: service_healthy
    command: ["./scripts/start-example.sh"]
    networks:
      - example

  integration-tests:
    build: *dockerfile-dev-build
    volumes:
      - .:/app
    env_file: .env
    ports:
      - "${DJANGO_BIND_PORT:-8080}:${DJANGO_BIND_PORT:-8080}"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      s3mock:
        condition: service_healthy
    command: ["./scripts/start-tests.sh"]
    networks:
      - example

  sonar:
    container_name: sonar
    image: sonarqube:9-community
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    ports:
      - "9000:9000"
    networks:
      - example

  sonar-cli:
    container_name: sonar-cli
    image: sonarsource/sonar-scanner-cli
    working_dir: /api
    environment:
      - SONAR_LOGIN=admin
      - SONAR_PASSWORD=test
    volumes:
      - .:/api
    command: ["sonar-scanner", "--debug"]
    networks:
      - example

  s3mock:
    image: adobe/s3mock:latest
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: example
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/favicon.ico"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - example

  lint-formatter:
    build: *dockerfile-dev-build
    volumes:
      - .:/app
    command: ["./scripts/start-formatter-lint.sh"]
    networks:
      - example

networks:
  example:
